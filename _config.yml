theme: jekyll-theme-cayman
title: Babel Player
description: >-
  A high-performance Windows workstation for segment-based AI dubbing —
  local RTX transcription, translation, and voice tools, with optional cloud APIs.
  Built with .NET 10 and Avalonia 12.
