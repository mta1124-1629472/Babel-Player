    url: https://github.com/Babelworks/Babel-Player#readme
  - title: Contributing
    url: https://github.com/Babelworks/Babel-Player/blob/main/CONTRIBUTING.md
  - title: Privacy
    url: /Babel-Player/privacy/

# Build settings
markdown: kramdown
plugins:
  - jekyll-seo-tag
