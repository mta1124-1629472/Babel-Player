name: APM Version Sync

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*.*.*'

jobs:
  sync-version:
    name: Sync apm.yml version to Git tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # Use a PAT or the default GITHUB_TOKEN. For protected branches,
          # replace with a PAT that has push access.
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        run: |
          # Strip refs/tags/ prefix if present, keep the v prefix
          TAG="${GITHUB_REF_NAME}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Update version in apm.yml
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          # Replace the version line in apm.yml in-place
          sed -i "s/^version: .*/version: ${TAG}/" apm.yml
          echo "Updated apm.yml version to ${TAG}"
          grep "^version:" apm.yml

      - name: Commit updated apm.yml
        id: commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apm.yml
          # Only commit if there is an actual change
          if git diff --cached --quiet; then
            echo "No version change, skipping commit."
            echo "committed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: sync apm.yml version to ${{ steps.version.outputs.tag }}"
            echo "committed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open update PR
        # Direct pushes are blocked by branch protection; propose the bump as a PR instead.
        if: steps.commit.outputs.committed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          BRANCH="chore/apm-version-${TAG}"
          git fetch origin "refs/heads/${BRANCH}:refs/remotes/origin/${BRANCH}" || true
          git push --force-with-lease origin "$BRANCH"
          
          # Check if PR already exists before creating
          if gh pr list --head "$BRANCH" --base main | grep -q .; then
            echo "PR already exists for branch ${BRANCH}"
          else
            gh pr create --base main --head "$BRANCH" \
              --title "chore: sync apm.yml version to ${TAG}" \
              --body "Automated version sync for tag ${TAG}."
          fi
