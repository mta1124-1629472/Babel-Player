name: Copilot Setup Steps

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest

    env:
      # Large Windows binaries (libmpv, uv) are not stored in Git; Linux agent jobs do not need them.
      GIT_LFS_SKIP_SMUDGE: 1

    steps:
      # Standard checkout — Git LFS is not used for tracked files in this repo.
      - name: Checkout (no LFS)
        uses: actions/checkout@v6
        with:
          lfs: false

      # Remove generated files that cause untracked-file conflicts on reruns
      - name: Clean generated artifacts
        run: rm -rf .claude BabelPlayer.Tests/Pipe || true

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore Babel-Player.sln
