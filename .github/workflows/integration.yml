name: Integration

concurrency:
  group: integration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    # All integration/RequiresPython/RequiresFfmpeg tests use fake providers in CI —
    # no real subprocess calls, no model downloads. Build + test should finish in ~5 min.
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          lfs: false
          clean: true
        env:
          GIT_LFS_SKIP_SMUDGE: '1'

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore Babel-Player.sln

      - name: Build
        run: dotnet build Babel-Player.sln --no-restore --configuration Release

      - name: Run integration tests
        run: >
          timeout 90 dotnet test BabelPlayer.Tests/BabelPlayer.Tests.csproj
          --no-build
          --configuration Release
          --filter "Category=Integration|Category=RequiresPython|Category=RequiresFfmpeg"
          --logger "trx;LogFileName=integration-results.trx"
          --results-directory TestResults
          || true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: integration-test-results
          path: TestResults/integration-results.trx
          retention-days: 3
