name: CI

# One active run per PR/ref: new commits cancel older runs so queued jobs do not stack for hours.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-core-test:
    name: Build & Core Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          lfs: false
          clean: true
        env:
          GIT_LFS_SKIP_SMUDGE: '1'

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore Babel-Player.sln

      - name: Build
        run: dotnet build Babel-Player.sln --no-restore --configuration Release

      - name: Run core tests
        run: >
          dotnet test BabelPlayer.Tests/BabelPlayer.Tests.csproj
          --no-build
          --configuration Release
          --blame-hang
          --blame-hang-timeout 2m
          --logger "trx;LogFileName=core-results.trx"
          --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: core-test-results
          path: TestResults/core-results.trx
          retention-days: 3
