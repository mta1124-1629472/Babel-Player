# Release Drafter config for Babel Player.
# Consumed by .github/workflows/release-drafter.yml on pushes to main.

categories:
  - title: Features
    labels:
      - feature
      - enhancement
  - title: Bug Fixes
    labels:
      - fix
      - bugfix
      - bug
  - title: Maintenance
    labels:
      - chore
      - dependencies
      - documentation
      - ci

# Map conventional-commit PR titles to labels so unlabelled PRs still categorize.
autolabeler:
  - label: feature
  - label: feature
    title: '/^feat(\(.*\))?(!:|[!:])?/'
  - label: fix
    title: '/^fix(\(.*\))?[!:]?/'
  - label: chore
    title: '/^(chore|docs|ci|build|test|refactor)(\(.*\))?[!:]?/'

exclude-labels:
  - skip-ci
