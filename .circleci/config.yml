version: 2.1

orbs:
  win: circleci/windows@5.0

jobs:
  build-and-test:
    executor:
      name: win/default
      shell: powershell.exe
    steps:
      - checkout

      - run:
          name: Install .NET 10
          command: |
            Invoke-WebRequest -Uri https://dot.net/v1/dotnet-install.ps1 -OutFile dotnet-install.ps1
            ./dotnet-install.ps1 -Channel 10.0 -InstallDir 'C:\Program Files\dotnet'

      - run:
          name: Restore Dependencies
          # Explicitly pointing to the .sln to fix the ambiguity error
          command: dotnet restore Babel-Player.sln

      - run:
          name: Build Babel Player
          command: dotnet build Babel-Player.sln --configuration Release --no-restore

      - run:
          name: Run Unit Tests
          # This will run tests found in BabelPlayer.Tests.csproj via the solution
          command: dotnet test Babel-Player.sln --no-build --verbosity normal

workflows:
  version: 2
  build_and_test_workflow:
    jobs:
      - build-and-test