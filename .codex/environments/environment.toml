# THIS IS AUTOGENERATED. DO NOT EDIT MANUALLY
version = 1
name = "agent-worktree"

[setup]
script = '''
<#
.SYNOPSIS
Initializes a freshly created Codex worktree for parallel agent work.

.DESCRIPTION
Runs from the source repo root and uses:
- CODEX_SOURCE_TREE_PATH
- CODEX_WORKTREE_PATH

What it does:
- validates the source repo and new worktree
- fetches/prunes origin
- adds .worktrees/ to .git/info/exclude locally if needed
- copies common local-only config files into the new worktree if missing
- prints a short summary for the agent session
#>

$ErrorActionPreference = "Stop"
Set-StrictMode -Version Latest

function Fail {
    param([string]$Message)
    throw $Message
}

function Info {
    param([string]$Message)
    Write-Host $Message -ForegroundColor Cyan
}

$sourceTree = $env:CODEX_SOURCE_TREE_PATH
$worktreePath = $env:CODEX_WORKTREE_PATH

if ([string]::IsNullOrWhiteSpace($sourceTree)) {
    Fail "CODEX_SOURCE_TREE_PATH is not set."
}

if ([string]::IsNullOrWhiteSpace($worktreePath)) {
    Fail "CODEX_WORKTREE_PATH is not set."
}

$sourceTree = (Resolve-Path $sourceTree).Path

if (-not (Test-Path $worktreePath)) {
    Fail "Worktree path does not exist yet: $worktreePath"
}

$worktreePath = (Resolve-Path $worktreePath).Path

if ($sourceTree -eq $worktreePath) {
    Fail "Source tree path and worktree path must be different."
}

& git -C $sourceTree rev-parse --is-inside-work-tree *> $null
if ($LASTEXITCODE -ne 0) {
    Fail "Source path is not a git repository: $sourceTree"
}

Info "Fetching latest refs..."
& git -C $sourceTree fetch origin --prune
if ($LASTEXITCODE -ne 0) {
    Fail "git fetch failed."
}

$gitDir = (& git -C $sourceTree rev-parse --git-dir).Trim()
if (-not [System.IO.Path]::IsPathRooted($gitDir)) {
    $gitDir = Join-Path $sourceTree $gitDir
}

$excludePath = Join-Path $gitDir "info/exclude"
$excludeEntry = ".worktrees/"

if (-not (Test-Path $excludePath)) {
    $parent = Split-Path $excludePath -Parent
    if (-not (Test-Path $parent)) {
        New-Item -ItemType Directory -Path $parent -Force | Out-Null
    }
    New-Item -ItemType File -Path $excludePath -Force | Out-Null
}

$excludeContent = Get-Content $excludePath -Raw
if ($excludeContent -notmatch [regex]::Escape($excludeEntry)) {
    Add-Content -Path $excludePath -Value "`n$excludeEntry`n"
    Info "Added .worktrees/ to .git/info/exclude"
}

$filesToCopy = @(
    ".env",
    ".env.local",
    ".env.development",
    ".env.test",
    ".npmrc",
    ".python-version",
    ".tool-versions"
)

foreach ($relativePath in $filesToCopy) {
    $sourceFile = Join-Path $sourceTree $relativePath
    $targetFile = Join-Path $worktreePath $relativePath

    if ((Test-Path $sourceFile) -and -not (Test-Path $targetFile)) {
        $targetDir = Split-Path $targetFile -Parent
        if (-not (Test-Path $targetDir)) {
            New-Item -ItemType Directory -Path $targetDir -Force | Out-Null
        }

        Copy-Item -Path $sourceFile -Destination $targetFile -Force
        Info "Copied $relativePath"
    }
}

$branchNameOutput = & git -C $worktreePath branch --show-current
if ($LASTEXITCODE -ne 0) {
    Fail "git branch lookup failed for worktree: $worktreePath"
}

$branchName = if ($null -ne $branchNameOutput) { $branchNameOutput.Trim() } else { "" }
if ([string]::IsNullOrWhiteSpace($branchName)) {
    $branchName = "<detached>"
}

Write-Host ""
Write-Host "Worktree ready" -ForegroundColor Green
Write-Host "Source repo : $sourceTree"
Write-Host "Worktree    : $worktreePath"
Write-Host "Branch      : $branchName"
Write-Host ""
Write-Host "Open this path in Codex/Devin:"
Write-Host $worktreePath
'''

[cleanup]
script = '''
<#
.SYNOPSIS
Cleans up repo-local agent worktrees and stale local/remote agent branches.

.DESCRIPTION
Designed for repos that use .worktrees plus agent branch prefixes such as:
- codex/*
- devin/*

Defaults:
- If CODEX_SOURCE_TREE_PATH is set, it uses that as the repo root.
- Otherwise it uses the current directory.

Safety:
- Refuses to run during merge/rebase/cherry-pick.
- Skips the currently checked out branch.
- Removes only worktrees under .worktrees by default.

.EXAMPLE
powershell -ExecutionPolicy Bypass -File .\cleanup-agent-worktrees.ps1 -WhatIf

.EXAMPLE
powershell -ExecutionPolicy Bypass -File .\cleanup-agent-worktrees.ps1 -RemoveExtraWorktrees -DeleteGoneLocalBranches

.EXAMPLE
powershell -ExecutionPolicy Bypass -File .\cleanup-agent-worktrees.ps1 -RemoveExtraWorktrees -DeleteGoneLocalBranches -DeleteMergedLocalBranches

.EXAMPLE
powershell -ExecutionPolicy Bypass -File .\cleanup-agent-worktrees.ps1 -RemoveExtraWorktrees -DeleteGoneLocalBranches -DeleteMergedLocalBranches -DeleteMergedRemoteBranches
#>

param(
    [string]$RepoPath = "",
    [string[]]$BranchPrefixes = @("codex/", "devin/"),
    [switch]$RemoveExtraWorktrees,
    [switch]$DeleteGoneLocalBranches,
    [switch]$DeleteMergedLocalBranches,
    [switch]$DeleteMergedRemoteBranches,
    [switch]$Force,
    [switch]$WhatIf
)

$ErrorActionPreference = "Stop"
Set-StrictMode -Version Latest

function Fail {
    param([string]$Message)
    throw $Message
}

function Info {
    param([string]$Message)
    Write-Host $Message -ForegroundColor Cyan
}

function Warn {
    param([string]$Message)
    Write-Host $Message -ForegroundColor Yellow
}

function Act {
    param([string]$Message)
    Write-Host $Message -ForegroundColor Green
}

function Run-Git {
    param(
        [Parameter(Mandatory = $true)]
        [string[]]$Args,
        [switch]$AllowFailure
    )

    $result = & git @Args 2>&1
    $exitCode = $LASTEXITCODE

    if (-not $AllowFailure -and $exitCode -ne 0) {
        throw "git $($Args -join ' ') failed:`n$result"
    }

    return @{
        Output = @($result)
        ExitCode = $exitCode
    }
}

function Matches-AgentPrefix {
    param(
        [string]$BranchName,
        [string[]]$Prefixes
    )

    foreach ($prefix in $Prefixes) {
        if ($BranchName.StartsWith($prefix, [System.StringComparison]::OrdinalIgnoreCase)) {
            return $true
        }
    }

    return $false
}

if ([string]::IsNullOrWhiteSpace($RepoPath)) {
    if (-not [string]::IsNullOrWhiteSpace($env:CODEX_SOURCE_TREE_PATH)) {
        $RepoPath = $env:CODEX_SOURCE_TREE_PATH
    } else {
        $RepoPath = (Get-Location).Path
    }
}

if (-not $RemoveExtraWorktrees -and -not $DeleteGoneLocalBranches -and -not $DeleteMergedLocalBranches -and -not $DeleteMergedRemoteBranches) {
    $RemoveExtraWorktrees = $true
}

$repoRoot = (Resolve-Path $RepoPath).Path
$repoRoot = [System.IO.Path]::GetFullPath($repoRoot)
$worktreesRoot = Join-Path $repoRoot ".worktrees"
$worktreesRootPrefix = if ($worktreesRoot.EndsWith([System.IO.Path]::DirectorySeparatorChar)) {
    $worktreesRoot
} else {
    $worktreesRoot + [System.IO.Path]::DirectorySeparatorChar
}

Push-Location $repoRoot
try {
    Run-Git -Args @("rev-parse", "--is-inside-work-tree") | Out-Null

    $gitDir = (Run-Git -Args @("rev-parse", "--git-dir")).Output[0]
    if (-not [System.IO.Path]::IsPathRooted($gitDir)) {
        $gitDir = Join-Path $repoRoot $gitDir
    }

    foreach ($stateFile in @("CHERRY_PICK_HEAD", "REBASE_HEAD", "MERGE_HEAD")) {
        if (Test-Path (Join-Path $gitDir $stateFile)) {
            Fail "Git operation in progress ($stateFile). Finish or abort it first."
        }
    }

    Info "Fetching and pruning remotes..."
    Run-Git -Args @("fetch", "--all", "--prune") | Out-Null

    $currentBranchOutput = (Run-Git -Args @("branch", "--show-current")).Output
    $currentBranch = if (
        $currentBranchOutput.Count -gt 0 -and
        -not [string]::IsNullOrWhiteSpace($currentBranchOutput[0])
    ) {
        $currentBranchOutput[0].Trim()
    } else {
        ""
    }

    if ([string]::IsNullOrWhiteSpace($currentBranch)) {
        Info "Current branch: <detached>"
    } else {
        Info "Current branch: $currentBranch"
    }

    if ($RemoveExtraWorktrees) {
        Info "Scanning worktrees..."
        $lines = (Run-Git -Args @("worktree", "list", "--porcelain")).Output
        $worktrees = @()
        $current = @{}

        foreach ($line in $lines) {
            if ($line -like "worktree *") {
                if ($current.Count -gt 0) {
                    $worktrees += [pscustomobject]$current
                }
                $current = @{ Path = $line.Substring(9) }
            } elseif ($line -like "branch *") {
                $current.Branch = $line.Substring(7) -replace '^refs/heads/', ''
            }
        }

        if ($current.Count -gt 0) {
            $worktrees += [pscustomobject]$current
        }

        $extraWorktrees = $worktrees | Where-Object {
            $worktreePath = [System.IO.Path]::GetFullPath($_.Path)
            $worktreePath -ne $repoRoot -and
                $worktreePath.StartsWith($worktreesRootPrefix, [System.StringComparison]::OrdinalIgnoreCase)
        }

        foreach ($wt in $extraWorktrees) {
            $branch = if ($wt.Branch) { $wt.Branch } else { "<detached>" }

            if ($WhatIf) {
                Warn "[WhatIf] Would remove worktree $($wt.Path) ($branch)"
            } else {
                $args = @("worktree", "remove")
                if ($Force) {
                    $args += "--force"
                }
                $args += $wt.Path

                Act "Removing worktree $($wt.Path) ($branch)"
                Run-Git -Args $args | Out-Null
            }
        }

        if ($WhatIf) {
            Warn "[WhatIf] Would run git worktree prune"
        } else {
            Run-Git -Args @("worktree", "prune") | Out-Null
        }
    }

    $branchRows = (Run-Git -Args @(
        "for-each-ref",
        "--format=%(refname:short)|%(upstream:short)|%(upstream:track)",
        "refs/heads"
    )).Output

    if ($DeleteGoneLocalBranches) {
        Info "Deleting local agent branches with gone or missing upstreams..."
        foreach ($row in $branchRows) {
            $parts = $row -split '\|', 3
            $branch = $parts[0].Trim()
            $upstream = $parts[1].Trim()
            $track = $parts[2].Trim()

            if ([string]::IsNullOrWhiteSpace($branch)) { continue }
            if ($branch -eq "main" -or $branch -eq $currentBranch) { continue }
            if (-not (Matches-AgentPrefix -BranchName $branch -Prefixes $BranchPrefixes)) { continue }

            $upstreamGone = $track -like "*gone*"
            $missingUpstream = [string]::IsNullOrWhiteSpace($upstream)

            if ($upstreamGone -or $missingUpstream) {
                if ($WhatIf) {
                    Warn "[WhatIf] Would delete local branch $branch"
                } else {
                    Act "Deleting local branch $branch"
                    Run-Git -Args @("branch", "-D", $branch) | Out-Null
                }
            }
        }
    }

    if ($DeleteMergedLocalBranches) {
        Info "Deleting merged local agent branches..."
        $mergedBranches = (Run-Git -Args @("branch", "--merged", "origin/main")).Output |
            ForEach-Object { $_.Trim().TrimStart('*').Trim() } |
            Where-Object {
                $_ -and $_ -ne "main" -and $_ -ne $currentBranch -and
                (Matches-AgentPrefix -BranchName $_ -Prefixes $BranchPrefixes)
            }

        foreach ($branch in $mergedBranches) {
            if ($WhatIf) {
                Warn "[WhatIf] Would delete merged local branch $branch"
            } else {
                Act "Deleting merged local branch $branch"
                Run-Git -Args @("branch", "-d", $branch) | Out-Null
            }
        }
    }

    if ($DeleteMergedRemoteBranches) {
        Info "Deleting merged remote agent branches..."
        $remoteBranches = (Run-Git -Args @(
            "for-each-ref",
            "--format=%(refname:short)",
            "refs/remotes/origin"
        )).Output | Where-Object {
            if (-not $_) { return $false }

            $shortBranch = $_ -replace '^origin/', ''
            $shortBranch -ne $currentBranch -and
                (Matches-AgentPrefix -BranchName $shortBranch -Prefixes $BranchPrefixes)
        }

        foreach ($remote in $remoteBranches) {
            $shortBranch = $remote -replace '^origin/', ''
            if ($shortBranch -eq $currentBranch) {
                continue
            }

            $isMerged = Run-Git -Args @("merge-base", "--is-ancestor", $remote, "origin/main") -AllowFailure
            if ($isMerged.ExitCode -ne 0) {
                continue
            }

            if ($WhatIf) {
                Warn "[WhatIf] Would delete remote branch $shortBranch"
            } else {
                Act "Deleting remote branch $shortBranch"
                Run-Git -Args @("push", "origin", "--delete", $shortBranch) | Out-Null
            }
        }
    }

    Info "Cleanup complete."
}
finally {
    Pop-Location
}
'''

[[actions]]
name = "Run"
icon = "run"
command = '''
dotnet restore Babel-Player.sln

dotnet build Babel-Player.sln --no-restore -v quiet

dotnet run --project BabelPlayer.csproj --no-build
'''

[[actions]]
name = "Test (Excluding Quarantined)"
icon = "test"
command = "dotnet test BabelPlayer.Tests/BabelPlayer.Tests.csproj -c Release --filter \"Category!=Quarantined\""

[[actions]]
name = "Smoke"
icon = "test"
command = "dotnet test BabelPlayer.Tests/BabelPlayer.Tests.csproj -c Release --filter \"Category=Smoke\""

[[actions]]
name = "Dev"
icon = "debug"
command = "dotnet run -c Dev --project BabelPlayer.csproj"

[[actions]]
name = "Cleanup Preview"
icon = "tool"
command = "powershell -ExecutionPolicy Bypass -File .\\cleanup-agent-worktrees.ps1 -WhatIf"

[[actions]]
name = "Cleanup"
icon = "tool"
command = "powershell -ExecutionPolicy Bypass -File .\\cleanup-agent-worktrees.ps1 -RemoveExtraWorktrees -DeleteGoneLocalBranches -DeleteMergedLocalBranches -DeleteMergedRemoteBranches"
